<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test — Political Spectrum Test</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F8F7F4; }
a { color: #5F5D66; } a:hover { color: #16151A; }
button { font-family: inherit; }
</style>
</helmet>

<div style="background:#F8F7F4; color:#16151A; min-height:100%; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased">

<!-- Header -->
<header style="border-bottom:1px solid #E5E3DC">
  <div style="max-width:1160px; margin:0 auto; padding:0 48px; height:70px; display:flex; align-items:center; justify-content:space-between">
    <a href="./Main.dc.html" style="display:flex; align-items:center; gap:11px; text-decoration:none; color:#16151A">
      <svg width="25" height="25" viewBox="0 0 28 28" aria-hidden="true">
        <defs><linearGradient id="lg-t" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#D64550"/><stop offset="0.36" stop-color="#E39B2D"/><stop offset="0.64" stop-color="#7C9C62"/><stop offset="1" stop-color="#3D6FA8"/>
        </linearGradient></defs>
        <circle cx="14" cy="14" r="9.5" fill="none" stroke="url(#lg-t)" stroke-width="5"/>
      </svg>
      <span style="font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:17px">Political Spectrum Test</span>
    </a>
    <a href="./Main.dc.html" style="font-size:14px; font-weight:500; color:#6E6C76; text-decoration:none">Exit test</a>
  </div>
</header>

<!-- Progress -->
<div style="max-width:780px; width:100%; margin:0 auto; padding:34px 48px 0">
  <div style="display:flex; justify-content:space-between; align-items:center">
    <div style="font-size:14px; font-weight:600">Question {{ num }} of 24</div>
    <div style="font-size:11px; font-weight:600; letter-spacing:0.13em; text-transform:uppercase; color:#6E6C76; background:#FFFFFF; border:1px solid #E5E3DC; border-radius:999px; padding:6px 14px">{{ group }}</div>
  </div>
  <div style="margin-top:14px; height:8px; border-radius:999px; background:#E9E7E0; overflow:hidden">
    <div style="height:100%; border-radius:999px; width: {{ pct }}%; background:linear-gradient(90deg, #D64550 0%, #E39B2D 34%, #7C9C62 63%, #3D6FA8 100%)"></div>
  </div>
</div>

<!-- Question -->
<main style="max-width:780px; width:100%; margin:0 auto; padding:44px 48px 0; flex:1">
  <h1 style="margin:0; font-family:'Fraunces',Georgia,serif; font-size:31px; line-height:1.32; font-weight:600; letter-spacing:-0.005em">{{ text }}</h1>

  <div style="margin-top:34px; display:flex; flex-direction:column; gap:12px">
    <button onClick="{{ o0.pick }}" style="display:flex; align-items:center; gap:16px; width:100%; text-align:left; background: {{ o0.bg }}; border: {{ o0.bd }}; border-radius:15px; padding:17px 20px; cursor:pointer; font-size:16px; font-weight:500; color:#16151A">
      <span style="width:20px; height:20px; border-radius:50%; flex:none; background: {{ o0.dot }}; border:2px solid {{ o0.dotBd }}"></span>
      <span style="flex:1">{{ o0.label }}</span>
      <span style="font-size:11px; color:#8A8894; border:1px solid #E5E3DC; border-radius:6px; padding:2px 7px; background:#FFFFFF">1</span>
    </button>
    <button onClick="{{ o1.pick }}" style="display:flex; align-items:center; gap:16px; width:100%; text-align:left; background: {{ o1.bg }}; border: {{ o1.bd }}; border-radius:15px; padding:17px 20px; cursor:pointer; font-size:16px; font-weight:500; color:#16151A">
      <span style="width:20px; height:20px; border-radius:50%; flex:none; background: {{ o1.dot }}; border:2px solid {{ o1.dotBd }}"></span>
      <span style="flex:1">{{ o1.label }}</span>
      <span style="font-size:11px; color:#8A8894; border:1px solid #E5E3DC; border-radius:6px; padding:2px 7px; background:#FFFFFF">2</span>
    </button>
    <button onClick="{{ o2.pick }}" style="display:flex; align-items:center; gap:16px; width:100%; text-align:left; background: {{ o2.bg }}; border: {{ o2.bd }}; border-radius:15px; padding:17px 20px; cursor:pointer; font-size:16px; font-weight:500; color:#16151A">
      <span style="width:20px; height:20px; border-radius:50%; flex:none; background: {{ o2.dot }}; border:2px solid {{ o2.dotBd }}"></span>
      <span style="flex:1">{{ o2.label }}</span>
      <span style="font-size:11px; color:#8A8894; border:1px solid #E5E3DC; border-radius:6px; padding:2px 7px; background:#FFFFFF">3</span>
    </button>
    <button onClick="{{ o3.pick }}" style="display:flex; align-items:center; gap:16px; width:100%; text-align:left; background: {{ o3.bg }}; border: {{ o3.bd }}; border-radius:15px; padding:17px 20px; cursor:pointer; font-size:16px; font-weight:500; color:#16151A">
      <span style="width:20px; height:20px; border-radius:50%; flex:none; background: {{ o3.dot }}; border:2px solid {{ o3.dotBd }}"></span>
      <span style="flex:1">{{ o3.label }}</span>
      <span style="font-size:11px; color:#8A8894; border:1px solid #E5E3DC; border-radius:6px; padding:2px 7px; background:#FFFFFF">4</span>
    </button>
    <button onClick="{{ o4.pick }}" style="display:flex; align-items:center; gap:16px; width:100%; text-align:left; background: {{ o4.bg }}; border: {{ o4.bd }}; border-radius:15px; padding:17px 20px; cursor:pointer; font-size:16px; font-weight:500; color:#16151A">
      <span style="width:20px; height:20px; border-radius:50%; flex:none; background: {{ o4.dot }}; border:2px solid {{ o4.dotBd }}"></span>
      <span style="flex:1">{{ o4.label }}</span>
      <span style="font-size:11px; color:#8A8894; border:1px solid #E5E3DC; border-radius:6px; padding:2px 7px; background:#FFFFFF">5</span>
    </button>
  </div>

  <div style="margin-top:30px; display:flex; align-items:center; justify-content:space-between; gap:16px">
    <button onClick="{{ back }}" style="background: {{ backBg }}; border: {{ backBd }}; border-radius:999px; padding:14px 26px; font-size:15px; font-weight:600; cursor:pointer; color: {{ backColor }}">Back</button>
    <sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}">
      <a href="./Results.dc.html" style="display:inline-flex; align-items:center; gap:10px; background:#16151A; color:#FFFFFF; border-radius:999px; padding:14px 28px; font-size:15px; font-weight:600; text-decoration:none">Finish — see my result
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </a>
    </sc-if>
    <sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ next }}" style="display:inline-flex; align-items:center; gap:10px; background:#16151A; color:#FFFFFF; border-radius:999px; padding:14px 28px; font-size:15px; font-weight:600; cursor:pointer; opacity: {{ nextOpacity }}">Next question
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </button>
    </sc-if>
  </div>

  <div style="margin-top:22px; padding-bottom:40px; font-size:13px; color:#8A8894">Press 1–5 to answer · Your progress saves automatically on this device</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  state = { qi: 0, picked: null };
  renderVals() {
    var questions = [
      { num: 5,  group: 'Economy',         text: 'Higher taxes on the wealthiest households are a fair way to fund public services.' },
      { num: 11, group: 'Civil Liberties', text: 'Security agencies should have more power to monitor private communications to keep us safe.' },
      { num: 17, group: 'Society',         text: 'Traditional family structures are the foundation of a healthy society.' },
      { num: 24, group: 'Global Outlook',  text: 'My country should put its own interests first, even when that means stepping back from international agreements.' }
    ];
    var labels = ['Strongly disagree', 'Disagree', 'Neutral / no opinion', 'Agree', 'Strongly agree'];
    var qi = this.state.qi;
    var picked = this.state.picked;
    var q = questions[qi];
    var self = this;
    var options = labels.map(function (label, i) {
      var sel = picked === i;
      return {
        label: label,
        dot: sel ? '#16151A' : 'transparent',
        dotBd: sel ? '#16151A' : '#B9B6AC',
        bg: sel ? '#F1EFE9' : '#FFFFFF',
        bd: sel ? '2px solid #16151A' : '1px solid #E5E3DC',
        pick: function () { self.setState({ picked: i }); }
      };
    });
    return {
      num: q.num,
      group: q.group,
      text: q.text,
      pct: Math.round(q.num / 24 * 100),
      o0: options[0], o1: options[1], o2: options[2], o3: options[3], o4: options[4],
      isLast: qi === questions.length - 1,
      notLast: qi < questions.length - 1,
      nextOpacity: picked === null ? 0.45 : 1,
      backBg: qi === 0 ? 'transparent' : '#FFFFFF',
      backBd: qi === 0 ? '1px solid transparent' : '1px solid #E5E3DC',
      backColor: qi === 0 ? '#B0AEA6' : '#16151A',
      back: function () { self.setState({ qi: Math.max(0, qi - 1), picked: null }); },
      next: function () { self.setState({ qi: qi + 1, picked: null }); }
    };
  }
}
</script>
</body>
</html>
