<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Results Mobile — Political Spectrum Test</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F8F7F4; }
a { color: #5F5D66; } a:hover { color: #16151A; }
</style>
</helmet>

<div style="width:390px; background:#F8F7F4; color:#16151A; -webkit-font-smoothing:antialiased">

<!-- Header -->
<header style="border-bottom:1px solid #E5E3DC">
  <div style="padding:0 22px; height:58px; display:flex; align-items:center; justify-content:space-between">
    <div style="display:flex; align-items:center; gap:9px">
      <svg width="21" height="21" viewBox="0 0 28 28" aria-hidden="true">
        <defs><linearGradient id="lg-rm" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#D64550"/><stop offset="0.36" stop-color="#E39B2D"/><stop offset="0.64" stop-color="#7C9C62"/><stop offset="1" stop-color="#3D6FA8"/>
        </linearGradient></defs>
        <circle cx="14" cy="14" r="9.5" fill="none" stroke="url(#lg-rm)" stroke-width="5"/>
      </svg>
      <span style="font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:14px">Political Spectrum Test</span>
    </div>
    <a href="#" style="background:#16151A; color:#FFFFFF; padding:9px 16px; border-radius:999px; font-weight:600; font-size:12.5px; text-decoration:none">Retake</a>
  </div>
</header>

<!-- Result hero -->
<section style="padding:36px 22px 0">
  <div style="font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#6E6C76">Your result</div>
  <h1 style="margin:12px 0 0; font-family:'Fraunces',Georgia,serif; font-size:33px; font-weight:600; line-height:1.12; letter-spacing:-0.01em">You lean <span style="color:#3D6FA8">Social Democrat</span></h1>
  <p style="margin:14px 0 0; font-size:14.5px; line-height:1.6; color:#5F5D66">Center-left on economics, strongly on the side of civil liberties, moderately progressive on society.</p>
</section>

<!-- Map -->
<section style="padding:24px 22px 0">
  <div style="background:#FFFFFF; border:1px solid #E5E3DC; border-radius:20px; padding:20px">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <div style="font-size:15px; font-weight:600">Political Map</div>
      <div style="display:flex; gap:12px; font-size:11px; color:#6E6C76">
        <span style="display:inline-flex; align-items:center; gap:5px"><span style="width:9px; height:9px; border-radius:50%; background:#16151A; display:inline-block"></span> You</span>
        <span style="display:inline-flex; align-items:center; gap:5px"><span style="width:9px; height:9px; border-radius:50%; border:2px solid #3D6FA8; display:inline-block; box-sizing:border-box"></span> Match</span>
      </div>
    </div>
    <div style="margin-top:14px; display:flex; justify-content:center">
      <svg width="280" height="280" viewBox="0 0 460 460" role="img" aria-label="Your political map">
        <rect x="40" y="40" width="190" height="190" fill="#F6E3E0"/>
        <rect x="230" y="40" width="190" height="190" fill="#E2E7F0"/>
        <rect x="40" y="230" width="190" height="190" fill="#E4EAD9"/>
        <rect x="230" y="230" width="190" height="190" fill="#F2E9D4"/>
        <line x1="230" y1="30" x2="230" y2="430" stroke="#B9B6AC" stroke-width="1.3"/>
        <line x1="30" y1="230" x2="430" y2="230" stroke="#B9B6AC" stroke-width="1.3"/>
        <text x="230" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#4A4850">LIBERTY</text>
        <text x="230" y="450" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#4A4850">AUTHORITY</text>
        <text x="16" y="234" text-anchor="middle" transform="rotate(-90 16 234)" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#4A4850">ECONOMIC LEFT</text>
        <text x="446" y="234" text-anchor="middle" transform="rotate(90 446 234)" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#4A4850">ECONOMIC RIGHT</text>
        <circle cx="292" cy="122" r="12" fill="#16151A" stroke="#FFFFFF" stroke-width="4"/>
        <circle cx="276" cy="104" r="10" fill="none" stroke="#3D6FA8" stroke-width="3"/>
      </svg>
    </div>
  </div>
</section>

<!-- Match card -->
<section style="padding:20px 22px 0">
  <div style="background:#16151A; border-radius:20px; padding:24px">
    <div style="font-size:11px; font-weight:600; letter-spacing:0.13em; text-transform:uppercase; color:#B9B7BF">Closest match</div>
    <div style="margin-top:10px; font-family:'Fraunces',Georgia,serif; font-size:26px; font-weight:600; color:#FFFFFF">Social Democrat</div>
    <div style="margin-top:12px; display:flex; align-items:center; gap:12px">
      <div style="flex:1; height:7px; border-radius:999px; background:rgba(255,255,255,0.14)"><div style="width:87%; height:100%; border-radius:999px; background:linear-gradient(90deg, #D64550, #E39B2D, #7C9C62, #3D6FA8)"></div></div>
      <div style="font-size:13px; font-weight:600; color:#FFFFFF">87%</div>
    </div>
    <div style="margin-top:16px; display:flex; flex-direction:column; gap:10px">
      <button style="display:flex; align-items:center; justify-content:center; gap:9px; background:#FFFFFF; color:#16151A; border:none; border-radius:999px; padding:13px 22px; font-size:14px; font-weight:600; cursor:pointer">Copy result link</button>
      <button style="display:flex; align-items:center; justify-content:center; gap:9px; background:transparent; color:#FFFFFF; border:1px solid rgba(255,255,255,0.3); border-radius:999px; padding:13px 22px; font-size:14px; font-weight:600; cursor:pointer">Download map as image</button>
    </div>
    <div style="margin-top:12px; font-size:11.5px; color:#B9B7BF; text-align:center">The link carries only your four scores — never your answers.</div>
  </div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
